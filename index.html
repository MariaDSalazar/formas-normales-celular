<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Turno en la Agencia · Formas normales</title>
<meta name="theme-color" content="#002C71">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23002C71'/%3E%3Crect x='12' y='16' width='40' height='32' rx='4' fill='%23EAAA00'/%3E%3Cpath d='M12 28h40M12 38h40M26 16v32' stroke='%23002C71' stroke-width='3'/%3E%3C/svg%3E">
<style>
:root { --oro: #EAAA00; --azul: #002C71; --pet: #002C38; --mag: #910048; --gris: #2D3B45; --bl: #FFFFFF;
  --azul-t: #E6EBF4; --azul-t2: #CBD5E8; --mag-t: #F6E3EB; --oro-t: #FDF3D1; --pet-t: #E1EBED; --gris-t: #EEF1F3; --linea: #C9D2DA; }
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; font: 18px/1.4 system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; color: var(--gris); background: var(--gris-t); min-height: 100vh; overflow-x: hidden; }
button, input { font: inherit; color: inherit; touch-action: manipulation; }
button { cursor: pointer; }
#app { max-width: 560px; margin: 0 auto; background: var(--bl); min-height: 100vh; display: flex; flex-direction: column; border-bottom: 10px solid var(--oro); }
@media (min-width: 700px) { body { padding: 18px 0; } #app { min-height: calc(100vh - 36px); border-radius: 22px; box-shadow: 0 12px 40px rgba(45, 59, 69, .2); border-bottom-width: 12px; } }
.cargando { text-align: center; padding: 3rem 1rem; color: var(--azul); font-weight: 700; }
svg.ic { width: 28px; height: 28px; flex: none; display: block; }
svg.ic.g { width: 64px; height: 64px; }

/* barra superior */
.top { position: sticky; top: 0; z-index: 20; background: var(--bl); border-bottom: 4px solid var(--oro); padding: 8px 14px 8px; }
.top .l1 { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.marca { font-weight: 800; color: var(--azul); font-size: 20px; line-height: 1.1; }
.btn-hoja { min-height: 48px; padding: 0 14px; border: 2px solid var(--azul); background: var(--bl); color: var(--azul); font-weight: 700; border-radius: 14px; display: flex; gap: 8px; align-items: center; }
.btn-hoja svg.ic { width: 24px; height: 24px; }
.top .l2 { display: flex; align-items: center; gap: 12px; margin-top: 6px; }
.prog { flex: 1; height: 16px; border-radius: 9px; background: var(--azul-t); overflow: hidden; }
.prog i { display: block; height: 100%; background: var(--azul); border-radius: 9px; transition: width .5s; }
.stat { display: flex; align-items: center; gap: 4px; font-weight: 800; color: var(--azul); }
.stat svg.ic { width: 24px; height: 24px; }
.stat.rc { color: var(--oro); }
.stat.rc b { color: var(--pet); }
.pop { animation: pop .45s; }

/* pantallas */
.pant { padding: 14px 14px 20px; flex: 1; display: flex; flex-direction: column; gap: 12px; }
.banda { position: relative; isolation: isolate; align-self: center; max-width: 100%; margin: 8px 12px; padding: 10px 24px; background: var(--oro); color: var(--pet); font-weight: 800; font-size: 28px; line-height: 1.15; text-align: center; transform: rotate(-1.4deg); }
.banda::after { content: ""; position: absolute; inset: 7px -9px -9px 9px; border: 2px solid var(--oro); z-index: -1; }
.sub { text-align: center; margin: 0; font-weight: 600; color: var(--azul); }
.etq { display: flex; justify-content: space-between; gap: 8px; font-weight: 700; color: var(--azul); }
.etq .cont { color: var(--pet); background: var(--oro-t); border-radius: 12px; padding: 0 10px; white-space: nowrap; }
.preg { font-size: 22px; line-height: 1.3; font-weight: 800; color: var(--pet); margin: 0; }
.ayuda { margin: 0; color: var(--gris); }
.tarj { background: var(--azul-t); border-radius: 18px; padding: 14px; }
.como p { display: flex; gap: 12px; align-items: center; margin: 8px 0; font-weight: 600; }
.como svg.ic { color: var(--azul); }
label { font-weight: 700; color: var(--pet); display: block; margin-bottom: 6px; }
input[type=text] { width: 100%; min-height: 56px; font-size: 20px; font-weight: 600; padding: 10px 14px; border: 3px solid var(--azul); border-radius: 14px; background: var(--bl); }
input[type=text]:focus { outline: 4px solid var(--oro); }
.aviso { margin: 6px 0 0; min-height: 0; font-weight: 700; color: var(--mag); }
.aviso:empty { display: none; }
.btn { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; min-height: 58px; padding: 12px 18px; border: 0; border-radius: 16px; background: var(--azul); color: var(--bl); font-size: 20px; font-weight: 800; }
.btn.oro { background: var(--oro); color: var(--pet); }
.btn.sec { background: var(--bl); color: var(--azul); border: 3px solid var(--azul); }
.btn:active { transform: scale(.98); }
.btn svg.ic { width: 26px; height: 26px; }

/* situación, celda, tabla, evidencia */
.sit { display: flex; gap: 14px; align-items: center; background: var(--oro-t); border: 2px solid var(--oro); border-radius: 18px; padding: 14px; }
.sit .cir { width: 60px; height: 60px; border-radius: 50%; background: var(--oro); color: var(--pet); display: grid; place-items: center; flex: none; }
.sit .cir svg.ic { width: 34px; height: 34px; }
.sit p { margin: 0; font-weight: 700; font-size: 20px; color: var(--pet); }
.tabla { border: 3px solid var(--azul); border-radius: 14px; overflow: hidden; }
.tabla h3 { margin: 0; background: var(--azul); color: var(--bl); padding: 8px 12px; font-size: 20px; }
.tabla .c { padding: 8px 12px; border-top: 1px solid var(--linea); font-weight: 700; }
.evid { width: 100%; border-collapse: collapse; border-radius: 14px; overflow: hidden; }
.evid th { background: var(--azul); color: var(--bl); text-align: left; padding: 7px 10px; font-size: 19px; }
.evid td { padding: 5px 10px; border-bottom: 1px solid var(--linea); word-break: break-word; }
.evid tr:nth-child(even) td { background: var(--gris-t); }
.evid tr.nuevo td { border-top: 3px solid var(--azul-t2); }
.evid tr.m td { background: var(--mag-t); color: var(--mag); font-weight: 800; }
.evid tr.b td { background: var(--azul-t2); color: var(--azul); font-weight: 800; }

/* opciones */
.ops { display: flex; flex-direction: column; gap: 10px; }
.op { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 60px; padding: 12px 16px; text-align: left; border: 3px solid var(--azul); border-radius: 16px; background: var(--bl); color: var(--azul); font-weight: 800; font-size: 20px; line-height: 1.25; }
.op .oi { width: 28px; height: 28px; flex: none; }
.op:active { background: var(--azul-t); }
.op.bien { background: var(--azul); color: var(--bl); animation: pop .4s; }
.op.mal { background: var(--mag-t); border-color: var(--mag); color: var(--mag); animation: tiembla .4s; }
.op:disabled { cursor: default; }
.op.off { opacity: .55; }
.dos .op { justify-content: center; text-align: center; }
.dos { flex-direction: row; }
.dos .op { flex: 1; }
/* realimentación */
.dock { position: sticky; bottom: 0; z-index: 10; margin: 0 -14px; padding: 10px 14px calc(12px + env(safe-area-inset-bottom)); background: var(--bl); box-shadow: 0 -8px 16px rgba(45, 59, 69, .1); display: flex; flex-direction: column; gap: 10px; margin-top: auto; }
.fb { display: flex; gap: 12px; align-items: flex-start; border-radius: 16px; padding: 12px 14px; animation: sube .25s; }
.fb.bien { background: var(--azul-t); border: 2px solid var(--azul); color: var(--pet); }
.fb.mal { background: var(--mag-t); border: 2px solid var(--mag); color: var(--mag); }
.fb svg.ic { margin-top: 2px; }
.fb.bien svg.ic { color: var(--azul); }
.fb b { display: block; font-size: 19px; }
.fb span { display: block; font-weight: 600; }
.gana { font-weight: 800; color: var(--azul); }

/* tarjetas de la hoja */
.capa { position: fixed; inset: 0; z-index: 50; background: var(--bl); overflow: auto; }
.capa .in { max-width: 560px; margin: 0 auto; padding: 0 14px 30px; }
.capa .cab { position: sticky; top: 0; z-index: 2; background: var(--bl); border-bottom: 4px solid var(--oro); padding: 8px 0; display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
.capa .cab h2 { margin: 0; font-size: 22px; color: var(--azul); }
.cerrar { min-height: 52px; min-width: 52px; border: 2px solid var(--azul); border-radius: 14px; background: var(--bl); color: var(--azul); display: grid; place-items: center; }
.tf { border: 2px solid var(--linea); border-radius: 14px; padding: 8px 12px; margin-bottom: 10px; background: var(--bl); }
.tf p { margin: 2px 0; overflow-wrap: anywhere; }
.tf .lb { color: var(--gris); font-weight: 600; margin-right: 6px; }
.tf b { color: var(--azul); }
.tf .n { float: right; background: var(--oro); color: var(--pet); border-radius: 12px; padding: 0 10px; font-weight: 800; }
.tf .r { display: inline-block; border-radius: 12px; padding: 0 10px; font-weight: 800; }
.tf .r.a { background: var(--azul-t); color: var(--azul); }
.tf .r.b { background: var(--mag-t); color: var(--mag); }
.leyenda { background: var(--oro-t); border-radius: 12px; padding: 10px 12px; margin: 0 0 12px; font-weight: 600; }

/* intro de etapa y cierre */
.recap { display: flex; align-items: center; gap: 12px; background: var(--azul-t); border-radius: 16px; padding: 10px 14px; font-weight: 800; color: var(--azul); }
.recap .prog { background: var(--bl); }

/* reporte */
.rep h1 { margin: 0; font-size: 28px; color: var(--azul); overflow-wrap: anywhere; }
.rep .ceja { margin: 0; font-weight: 700; color: var(--gris); }
.total { display: flex; align-items: center; gap: 14px; background: var(--oro-t); border: 2px solid var(--oro); border-radius: 18px; padding: 12px 14px; }
.total .num { font-size: 44px; line-height: 1; font-weight: 800; color: var(--azul); }
.total p { margin: 0; font-weight: 700; color: var(--pet); }
.datos { display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; margin: 0; }
.datos dt { font-weight: 700; color: var(--gris); }
.datos dd { margin: 0; font-weight: 700; color: var(--pet); overflow-wrap: anywhere; }
.barras { display: grid; gap: 10px; }
.barras > div > span { display: flex; justify-content: space-between; gap: 8px; font-weight: 700; color: var(--pet); }
.barras i { display: block; height: 16px; border-radius: 9px; background: var(--azul-t); overflow: hidden; margin-top: 3px; }
.barras i b { display: block; height: 100%; background: var(--azul); -webkit-print-color-adjust: exact; print-color-adjust: exact; }
.rep h3 { margin: 6px 0 0; font-size: 20px; color: var(--azul); }
.rep ul { margin: 4px 0 0; padding-left: 1.2em; }
.rep li { margin: 4px 0; }
.rep li b { color: var(--mag); }
.verif { background: var(--azul-t); border-radius: 14px; padding: 10px 14px; font-weight: 700; color: var(--pet); }
.verif code { display: block; font: 800 22px/1.3 Consolas, 'Courier New', monospace; color: var(--azul); overflow-wrap: anywhere; }
.botones { display: flex; flex-direction: column; gap: 10px; }
.res { font-weight: 700; padding: 12px 14px; border-radius: 14px; }
.res.bien { background: var(--azul-t); color: var(--azul); border: 2px solid var(--azul); }
.res.mal { background: var(--mag-t); color: var(--mag); border: 2px solid var(--mag); }

/* avisos y fiesta */
.toast { position: fixed; left: 50%; width: max-content; top: 12px; transform: translate(-50%, -160%); background: var(--mag); color: var(--bl); padding: 10px 16px; border-radius: 12px; font-weight: 700; transition: transform .25s; z-index: 70; max-width: 92vw; }
.toast.ver { transform: translate(-50%, 0); }
.fiesta { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 65; }
.fiesta i { position: absolute; top: -16px; width: 10px; height: 16px; border-radius: 2px; animation: cae 2.1s ease-in forwards; }
@keyframes cae { to { transform: translateY(108vh) rotate(600deg); } }
@keyframes tiembla { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
@keyframes pop { 0% { transform: scale(.9); } 60% { transform: scale(1.04); } 100% { transform: scale(1); } }
@keyframes sube { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } .fiesta { display: none; } }
@media (max-width: 380px) { .banda { font-size: 25px; } .dos .op { font-size: 19px; } }

@media print {
  @page { size: A4; margin: 12mm; }
  body { background: var(--bl); font-size: 12pt; line-height: 1.3; }
  #app { max-width: none; border: 0; box-shadow: none; min-height: 0; }
  .no-imp, .top, .toast, .fiesta, .dock { display: none !important; }
  .pant { padding: 0; gap: 6pt; }
  .rep h1 { font-size: 20pt; }
  .rep h3 { font-size: 13pt; margin-top: 4pt; }
  .total { padding: 6pt 10pt; } .total .num { font-size: 28pt; }
  .barras { gap: 5pt; } .barras i { height: 9pt; }
  .verif code { font-size: 14pt; }
  .rep p { margin: 2pt 0; } .rep li { margin: 2pt 0; } .rep ul { padding-left: 14pt; } body { font-size: 11pt; }
  .total, .barras i, .verif, .banda { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
}


/* regla de la etapa, siempre a la vista bajo la barra */
.regla { margin-top: 6px; padding: 6px 12px; background: var(--oro-t); border: 2px solid var(--oro); border-radius: 12px; font-size: 18px; line-height: 1.25; color: var(--pet); font-weight: 600; }
.regla b { font-weight: 800; color: var(--azul); }
.toque { margin: 0; font-weight: 600; color: var(--gris); }
.cap { margin: 0; font-weight: 700; color: var(--azul); }
.recap { padding: 6px 14px; }

/* tablas de las preguntas */
.tabla h3 { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 4px 10px; }
.clv { display: inline-flex; align-items: center; gap: 6px; background: var(--oro); color: var(--pet); border-radius: 14px; padding: 0 10px; font-size: 18px; font-weight: 800; }
.clv svg.ic { width: 20px; height: 20px; }
.tabla .evid { border-radius: 0; }
.evid td { padding: 5px 8px; }
.evid th { padding: 6px 8px; }
.evid tr.m td { background: var(--mag-t); color: var(--mag); font-weight: 800; }
.evid tr.b td { background: var(--azul-t2); color: var(--azul); font-weight: 800; }
.listas { display: grid; gap: 8px; }
.lista { border: 3px solid var(--azul); border-radius: 14px; padding: 8px 12px; background: var(--bl); }
.lista h3 { margin: 0 0 6px; font-size: 20px; color: var(--azul); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { background: var(--azul-t); border: 2px solid var(--azul); border-radius: 18px; padding: 3px 12px; font-weight: 700; color: var(--azul); }
.tabla.dep svg { display: block; width: 100%; max-width: 360px; margin: 6px auto; height: auto; }
.dep svg text { font-family: inherit; font-size: 18px; font-weight: 800; }
.dc-k { fill: var(--oro); } .dt-k { fill: var(--pet); }
.dc-n { fill: var(--azul-t2); stroke: var(--azul); stroke-width: 2; } .dt-n { fill: var(--azul); }
.dc-t { fill: var(--bl); stroke: var(--azul); stroke-width: 3; } .dt-t { fill: var(--pet); }
.dep svg .dl { fill: var(--gris); font-weight: 600; }
.df-b { stroke: var(--azul); stroke-width: 5; fill: none; } .dh-b { fill: var(--azul); }
.df-g { stroke: var(--linea); stroke-width: 4; fill: none; } .dh-g { fill: var(--linea); }

/* opciones con subtítulo o con celda */
.op .cu { display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1; }
.op .st { font-weight: 600; font-size: 18px; color: var(--gris); }
.op.bien .st { color: var(--bl); }
.op.mal .st { color: var(--mag); }
.dos .op .cu { align-items: center; }
.ops.celdas { gap: 8px; border: 3px solid var(--oro); border-radius: 18px; padding: 8px; background: var(--oro-t); }
.celdas .op .cu { flex-direction: row; justify-content: space-between; align-items: center; gap: 12px; }
.celdas .op .lb { font-weight: 600; color: var(--gris); font-size: 18px; flex: none; }
.celdas .op.bien .lb { color: var(--bl); }
.celdas .op.mal .lb { color: var(--mag); }
.celdas .op .vl { text-align: right; overflow-wrap: anywhere; }
.op { scroll-margin-top: 190px; scroll-margin-bottom: 260px; }
.fb .otra { font-weight: 800; }
.fb b { display: inline; font-size: inherit; }

/* el ejemplo resuelto */
.mire { display: flex; align-items: center; gap: 10px; margin: 0; font-size: 24px; line-height: 1.2; color: var(--azul); }
.mire svg.ic { color: var(--oro); width: 32px; height: 32px; }
.demo { background: var(--bl); border: 3px solid var(--azul-t2); border-radius: 16px; padding: 6px; }
.demo-svg { display: block; width: 100%; max-width: 440px; margin: 0 auto; height: auto; overflow: visible; }
.demo-svg .el { opacity: 0; transition: opacity .6s ease, transform .9s ease; }
.demo-svg .el.on { opacity: 1; }
.demo-svg text { font-family: inherit; font-size: 18px; font-weight: 700; }
.demo-svg .rot { font-weight: 800; fill: var(--azul); }
.demo-svg .tx { font-weight: 600; fill: var(--pet); }
.demo-svg .c-th { fill: var(--azul); stroke: var(--azul); } .demo-svg .t-th { fill: #fff; }
.demo-svg .c-thk { fill: var(--oro); stroke: #B98600; } .demo-svg .t-thk { fill: var(--pet); }
.demo-svg .c-td { fill: #fff; stroke: var(--linea); } .demo-svg .t-td { fill: var(--gris); font-weight: 600; }
.demo-svg .ov-b { fill: rgba(0, 44, 113, .16); stroke: var(--azul); stroke-width: 3; }
.demo-svg .ov-m { fill: rgba(145, 0, 72, .14); stroke: var(--mag); stroke-width: 3; }
.demo-svg .ov-o { fill: rgba(234, 170, 0, .3); stroke: var(--oro); stroke-width: 3; }
.demo-svg .pl-b { fill: var(--azul-t); stroke: var(--azul); stroke-width: 2; } .demo-svg .t-pl-b { fill: var(--azul); }
.demo-svg .pl-m { fill: var(--mag-t); stroke: var(--mag); stroke-width: 2; } .demo-svg .t-pl-m { fill: var(--mag); }
.demo-svg .pl-o { fill: var(--oro-t); stroke: var(--oro); stroke-width: 2; } .demo-svg .t-pl-o { fill: var(--pet); }
.demo-svg .pl-g { fill: var(--gris-t); stroke: var(--linea); stroke-width: 2; } .demo-svg .t-pl-g { fill: var(--gris); }
.demo-svg .fl-b { stroke: var(--azul); stroke-width: 3.5; fill: none; } .demo-svg .fh-b { fill: var(--azul); }
.demo-svg .fl-m { stroke: var(--mag); stroke-width: 3.5; fill: none; } .demo-svg .fh-m { fill: var(--mag); }
.demo-svg .pt { fill: var(--azul); }
.demo-svg .sit { fill: var(--oro-t); stroke: var(--oro); stroke-width: 2; }
.pasos { display: flex; gap: 8px; justify-content: center; }
.pasos i { width: 34px; height: 10px; border-radius: 5px; background: var(--azul-t2); transition: background .3s; }
.pasos i.on { background: var(--azul); }
.paso-txt { margin: 0; font-size: 21px; line-height: 1.3; font-weight: 700; color: var(--pet); background: var(--oro-t); border-radius: 14px; padding: 8px 14px; min-height: 5.6em; }
.paso-txt .np { display: block; font-size: 18px; color: var(--azul); font-weight: 800; }
.ctl { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.ctl .btn { font-size: 19px; min-height: 54px; padding: 8px 10px; }
.btn:disabled { opacity: .45; cursor: default; }
.reglas { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; }
.reglas li { background: var(--azul-t); border-radius: 12px; padding: 6px 12px; color: var(--pet); font-weight: 600; }
.reglas b { color: var(--azul); }

.toast.ok { background: var(--azul); }
.etq { align-items: center; }
.etq .mire { font-size: 20px; }
.etq .cont { align-self: center; }
.etq .mire svg.ic { width: 30px; height: 30px; }

.evid td, .evid th { word-break: normal; overflow-wrap: break-word; }
.evid td.nw { white-space: nowrap; }

</style>
</head>
<body>
<div id="app"><p class="cargando">Abriendo el juego…</p></div>
<noscript><p class="cargando">Active JavaScript para jugar.</p></noscript>
<script>
/* Cifra: las respuestas no están en la página. Se guarda su huella (SHA-256) y el contenido que las revela va
   cifrado con AES-GCM; la llave sale de la respuesta correcta (o de una clave, con PBKDF2). Igual que cifra.py. */
(function (global) {
  'use strict';
  const te = new TextEncoder(), td = new TextDecoder();
  const hex = b => Array.from(new Uint8Array(b), x => x.toString(16).padStart(2, '0')).join('');
  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const unir = partes => te.encode(partes.map(String).join('|'));
  async function huella(...partes) { return hex(await crypto.subtle.digest('SHA-256', unir(partes))); }
  async function llave(...partes) {
    const raw = await crypto.subtle.digest('SHA-256', unir(partes));
    return crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);

  const entrada = async (id, oid, enc) => C.abrir(await C.llave(D.sal, E.v, id, oid), enc);
  const cargar = async () => { M = await C.abrir(await C.llave(D.sal, 'caso', E.v), D.v[E.v]); };

  // ---------- piezas
  function regla() {                                                              // la regla de la etapa, siempre a la vista
    if (!E || !M || E.pos.e < 0 || E.t1) return '';
    const st = M.et[E.pos.e];
    return `<div class="regla" role="note"><b>${esc(st.t)}:</b> ${rich(st.regla)}</div>`;
  }
  function top() {
    const pct = Math.round(hechos() / T() * 100);
    return `<header class="top no-imp"><div class="l1"><span class="marca">Turno en la Agencia</span><button class="btn-hoja" id="verhoja">${ic('hoja')}Ver hoja</button></div>
      <div class="l2"><div class="prog" role="progressbar" aria-label="Avance" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></div>
      <span class="stat" aria-label="Puntos">${ic('estrella')}<b id="pts">${pts()}</b></span><span class="stat rc" aria-label="Racha">${ic('flama')}<b id="rc">${E.rc}</b></span></div>${regla()}</header>`;
  }
  function tarjeta(f, i) {
    return `<article class="tf"><span class="n">${i + 1}</span><p><span class="lb">Placa</span><b>${esc(f[0])}</b></p><p><span class="lb">Marca</span>${esc(f[1])}</p>

      <p><span class="lb">Centro</span>${esc(f[5])}</p><p><span class="lb">Ciudad</span>${esc(f[6])}</p>
      <p><span class="lb">Fecha</span>${esc(f[7])} <span class="r ${f[8] === 'Aprobado' ? 'a' : 'b'}">${esc(f[8])}</span></p></article>`;
  }
  function hojaCapa() {
    if ($('.capa')) return;
    const c = document.createElement('div'); c.className = 'capa no-imp'; c.setAttribute('role', 'dialog'); c.setAttribute('aria-label', 'La hoja de la agencia');
    c.innerHTML = `<div class="in"><div class="cab"><h2>La hoja de la agencia</h2><button class="cerrar" id="cerrarhoja" aria-label="Cerrar">${ic('cruz')}</button></div>${M.hoja.f.map(tarjeta).join('')}</div>`;

  function cerrarHoja() { const c = $('.capa'); if (c) c.remove(); document.body.style.overflow = ''; }
  function toast(t, ok) {
    let el = $('#toast'); if (!el) { el = document.createElement('div'); el.id = 'toast'; el.setAttribute('role', 'status'); document.body.appendChild(el); }
    el.className = 'toast no-imp' + (ok ? ' ok' : ''); el.textContent = t; el.classList.add('ver'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('ver'), 5000);
  }
  function fiesta(n) {
    const c = document.createElement('div'); c.className = 'fiesta no-imp';
    c.innerHTML = Array.from({ length: n }, (_, i) => `<i style="left:${Math.random() * 100}%;background:${COLORES[i % COLORES.length]};animation-delay:${(Math.random() * .5).toFixed(2)}s"></i>`).join('');
    document.body.appendChild(c); setTimeout(() => c.remove(), 2900);
  }
  const brinco = id => { const b = $(id); if (b) { b.classList.remove('pop'); void b.offsetWidth; b.parentElement.classList.add('pop'); } };

  // ---------- inicio
  function inicio() {
    app.innerHTML = `<section class="pant"><h1 class="banda">Turno en la Agencia</h1><p class="sub">Formas normales, jugando desde el celular</p>
      <div class="tarj como"><p>${ic('ojo')}<span>Cada etapa empieza con un ejemplo resuelto: mírelo.</span></p>
      <p>${ic('toque')}<span>Después responda tocando la opción que crea correcta.</span></p>
      <p>${ic('estrella')}<span>Solo cuenta el primer intento. Si se equivoca, lea el porqué y siga.</span></p></div>
      <form id="f" autocomplete="off"><label for="nom">Escriba su nombre y apellido</label>
      <input id="nom" type="text" maxlength="60" autocapitalize="words" enterkeyhint="go"><p class="aviso" id="aviso"></p>
      <button class="btn oro" id="empezar" style="margin-top:14px">Empezar ${ic('flecha')}</button></form></section>`;
  }
  async function empezar() {
    const nom = $('#nom').value.trim().replace(/\s+/g, ' '), nn = norma(nom), aviso = $('#aviso');
    if (nn.split(' ').length < 2 || nn.length < 5) { aviso.textContent = 'Escriba su nombre y su apellido.'; return; }
    const v = parseInt((await C.huella(D.sal, 'nombre', nn)).slice(0, 8), 16) % D.v.length;       // la variante sale del nombre
    E = { nom, nn, v, t0: Date.now(), t1: 0, pos: { e: -1, j: -1 }, it: {}, fr: {}, rc: 0, rm: 0, sal: 0 };
    await cargar(); guardar(); await pintar();
  }

  // ---------- la hoja y las etapas
  function caso() {
    app.innerHTML = top() + `<section class="pant"><h1 class="banda">La hoja de la agencia</h1>
      <p class="ayuda">Una agencia de revisión técnica de vehículos guarda todo en una sola hoja. Cada fila es una revisión de un auto. Esta es la primera:</p>
      ${tarjeta(M.hoja.f[0], 0)}
      <p class="ayuda">Esa hoja repite datos y mezcla cosas. Las formas normales son cinco reglas para ordenarla: practicará una por etapa.</p>
      <div class="dock no-imp"><p class="ayuda">Puede ver la hoja completa con el botón Ver hoja.</p><button class="btn oro" id="ir">Entendido, empezar ${ic('flecha')}</button></div></section>`;
  }
  const cab = () => {
    const e = E.pos.e, j = E.pos.j, n = M.pa[e].length - 1;
    return `<div class="etq"><span>Etapa ${e + 1} de ${M.et.length}</span><span class="cont">${j === 0 ? 'Ejemplo' : `Pregunta ${j} de ${n}`}</span></div>`;
  };
  const botonSig = () => {
    const e = E.pos.e, ultimaPant = E.pos.j + 1 >= M.pa[e].length;
    return `<button class="btn" id="sig">${ultimaPant ? (e + 1 >= M.pa.length ? 'Ver mi reporte' : 'Terminar etapa') : 'Siguiente'} ${ic('flecha')}</button>`;
  };

  // ---------- el ejemplo resuelto: un dibujo que se anima solo, un paso y una frase a la vez
  function pantallaD() {
    const s = scr(), e = E.pos.e;
    app.innerHTML = top() + `<section class="pant" data-id="${s.id}"><div class="etq"><h1 class="mire">${ic('ojo')}Mire cómo se hace</h1><span class="cont">Etapa ${e + 1} de ${M.et.length}</span></div>
      <div class="demo" id="demo">${s.svg}</div>
      <div class="pasos" id="pasos" aria-hidden="true">${s.pasos.map(() => '<i></i>').join('')}</div>
      <p class="paso-txt" id="pasotxt" aria-live="polite"></p>
      <div class="ctl"><button class="btn sec" id="pa">${ic('atras')}Atrás</button><button class="btn sec" id="ps">Siguiente paso</button></div>
      <div class="dock no-imp"><button class="btn oro" id="ir">Entendido, probar yo ${ic('flecha')}</button></div></section>`;
    dp = { p: 0, n: s.pasos.length, pasos: s.pasos, t: 0 };

  }
  function demoPaso(p) {
    if (!dp) return;
    clearTimeout(dp.t); dp.p = p;
    $$('#demo .el').forEach(g => {
      g.classList.toggle('on', +g.dataset.d <= p && p <= +g.dataset.h);
      if (g.dataset.tr) { let xy = null; g.dataset.tr.split(';').forEach(t => { const [k, v] = t.split(':'); if (+k <= p) xy = v; }); if (xy) g.style.transform = `translate(${xy.split(',')[0]}px,${xy.split(',')[1]}px)`; }
    });
    const tx = $('#pasotxt'); if (!tx) return;
    tx.innerHTML = `<span class="np">Paso ${p} de ${dp.n}</span>${esc(dp.pasos[p - 1])}`;
    $$('#pasos i').forEach((i, k) => i.className = k < p ? 'on' : '');
    $('#pa').disabled = p === 1;
    $('#ps').innerHTML = p < dp.n ? 'Siguiente paso' : `${ic('repetir')}Ver otra vez`;
    if (p < dp.n) dp.t = setTimeout(() => demoPaso(p + 1), 2600 + dp.pasos[p - 1].length * 45);            // el tiempo de leer la frase
  }

  // ---------- preguntas de toque
  function tablaHtml(v) {
    const h = fb && fb.h ? new Set(fb.h) : new Set(), clase = fb && fb.c || '';
    const filas = v.f.map((r, i) => `<tr class="${h.has(i) ? clase : ''}">${r.map(x => `<td${/^[A-Z]{3}-\d{4}$|^\d{7,10}$|^\d{4}-\d{2}-\d{2}$/.test(x) ? ' class="nw"' : ''}>${esc(x)}</td>`).join('')}</tr>`).join('');
    return `<div class="tabla"><h3><span>${esc(v.n)}</span>${v.clave ? `<span class="clv">${ic('llave')}clave: ${esc(v.clave)}</span>` : ''}</h3>
      <table class="evid"><thead><tr>${v.cols.map(c => `<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${filas}</tbody></table></div>${v.cap ? `<p class="ayuda">${esc(v.cap)}</p>` : ''}`;
  }
  function depHtml(v) {                                                            // flecha desde una columna: clave arriba, otras columnas en medio, el dato abajo
    const w = 330, filas = v.nocl.length ? 3 : 2, h = 14 + filas * 62, yk = 14, yn = 76, yt = v.nocl.length ? 138 : 76;
    const cw = t => Math.round(t.length * 10.6 + 26);
    let x = 10; const claves = v.clave.map(t => { const o = { t, x, w: cw(t) }; x += o.w + 10; return o; });
    const de = claves.find(c => c.t === v.de) || { t: v.de, x: 10, w: cw(v.de) };
    const nocl = v.nocl.map(t => ({ t, x: 10, w: cw(t) })), nd = nocl.find(c => c.t === v.de);
    const origen = nd || de, yo = nd ? yn : yk, objetivo = { t: v.a, x: Math.min(origen.x, w - cw(v.a) - 4), w: cw(v.a) };
    const xa = origen.x + Math.min(origen.w, objetivo.w) / 2, chip = (o, y, cls) => `<rect class="dc-${cls}" x="${o.x}" y="${y}" width="${o.w}" height="40" rx="20"/><text class="dt-${cls}" x="${o.x + o.w / 2}" y="${y + 26}" text-anchor="middle">${esc(o.t)}</text>`;
    const flecha = (xa, y1, y2, cls) => `<path class="df-${cls}" d="M${xa} ${y1} L${xa} ${y2 - 12}"/><polygon class="dh-${cls}" points="${xa},${y2 - 2} ${xa - 9},${y2 - 16} ${xa + 9},${y2 - 16}"/>`;
    let g = `<text class="dl" x="${Math.max(...claves.map(c => c.x + c.w)) + 14}" y="${yk + 27}">Clave</text>` + claves.map(c => chip(c, yk, 'k')).join('');
    if (nocl.length) {
      g += `<text class="dl" x="${nocl[0].x + nocl[0].w + 14}" y="${yn + 27}">No es clave</text>` + nocl.map(c => chip(c, yn, 'n')).join('');
      g += flecha(nocl[0].x + nocl[0].w / 2 - 20, yk + 40, yn, 'g');
    }
    g += chip(objetivo, yt, 't') + flecha(xa, yo + 40, yt, 'b');
    return `<div class="tabla dep"><h3><span>${esc(v.tabla)}</span></h3><svg viewBox="0 0 ${w} ${h}" role="img" aria-label="Qué columna decide a cuál">${g}</svg></div><p class="ayuda">La flecha muestra qué columna decide a cuál.</p>`;
  }
  function visual(s) {
    const v = s.vis, q = `<h2 class="preg">${esc(s.q)}</h2>`;
    if (v.k === 'sit') return `<div class="sit"><div class="cir">${ic(v.ic)}</div><p>${esc(v.t)}</p></div>${q}`;
    if (v.k === 'tabla') return q + tablaHtml(v);
    if (v.k === 'cap') return q + `<p class="cap">${esc(v.t)}</p>`;
    if (v.k === 'dep') return q + depHtml(v);
    if (v.k === 'listas') return q + `<div class="listas">${v.l.map(x => `<div class="lista"><h3>${esc(x.t)}</h3><div class="chips">${x.v.map(c => `<span class="chip">${esc(c)}</span>`).join('')}</div></div>`).join('')}</div><p class="ayuda">${esc(v.cap)}</p>`;
    return q;
  }
  function opciones(s, x) {
    const hecho = !!(x && x.d), malas = (x && x.w) || [], celdas = s.o.every(o => o.c);
    const dos = s.o.length === 2 && s.o.every(o => o.t.length < 16 && !o.s);
    const cuerpo = o => o.c ? `<span class="lb">${esc(o.c)}</span><span class="vl">${esc(o.t)}</span>` : o.s ? `<span class="tt">${esc(o.t)}</span><span class="st">${esc(o.s)}</span>` : `<span>${esc(o.t)}</span>`;
    return `${celdas ? '' : '<p class="toque">Toque su respuesta.</p>'}<div class="ops${dos ? ' dos' : ''}${celdas ? ' celdas' : ''}">${s.o.map(o => {
      const bien = hecho && x.s === o.id, mal = !hecho && malas.includes(o.id);
      return `<button class="op${bien ? ' bien' : ''}${mal ? ' mal' : ''}${hecho && !bien ? ' off' : ''}" data-op="${o.id}"${hecho ? ' disabled' : ''}>${bien ? ic('check', 'oi') : mal ? ic('cruz', 'oi') : ''}<span class="cu">${cuerpo(o)}</span></button>`;
    }).join('')}</div>`;
  }
  const dock = (x, extra = '', celdas = false) => {
    const ok = fb && fb.k;
    return `<div class="dock no-imp">${fb ? `<div class="fb ${ok ? 'bien' : 'mal'}" role="status">${ic(ok ? 'check' : 'cruz')}<div><span><b>${ok ? 'Correcto:' : 'Incorrecto:'}</b> ${esc(fb.t)}</span>${ok ? '' : `<span class="otra">Toque otra ${celdas ? 'celda' : 'opción'}.</span>`}${extra}</div></div>` : ''}${x ? botonSig() : ''}</div>`;
  };
  async function pantallaQ() {
    const s = scr(), x = E.it[s.id];
    if (x && x.d && !fb) fb = { ...(await entrada(s.id, x.s, s.e[x.s])), op: x.s };
    const gana = x && x.d ? `<span class="gana">${x.p ? 'Suma 1 punto.' : 'No suma: falló en el primer intento.'}</span>` : '';
    app.innerHTML = top() + `<section class="pant" data-id="${s.id}">${cab()}${visual(s)}${opciones(s, x)}${dock(x && x.d, gana, s.o.every(o => o.c))}</section>`;
  }
  async function responder(oid) {
    const s = scr(), x = E.it[s.id] || (E.it[s.id] = { n: 0, p: null, d: 0, w: [] });
    if (x.d) return;
    const ent = await entrada(s.id, oid, s.e[oid]);
    x.n++;
    if (x.n === 1) { x.p = ent.k ? 1 : 0; if (ent.k) { E.rc++; E.rm = Math.max(E.rm, E.rc); } else E.rc = 0; }
    if (ent.k) { x.d = 1; x.s = oid; E.fr[s.id] = ent.f; } else if (!x.w.includes(oid)) x.w.push(oid);
    fb = { ...ent, op: oid };
    guardar(); await pintar(); marcada();
    if (ent.k) { brinco('#pts'); if (x.p) brinco('#rc'); } else if (navigator.vibrate) navigator.vibrate(40);
  }
  function marcada() {                                                           // deja a la vista la opción tocada, por encima del aviso
    const t = $(fb && fb.k ? '.op.bien' : '.op.mal'), r = t && t.getBoundingClientRect(), a = $('.top').getBoundingClientRect().bottom, b = $('.dock').getBoundingClientRect().top;
    if (t && (r.top < a + 4 || r.bottom > b - 4)) t.scrollIntoView({ block: 'center' });
  }

  async function siguiente() {
    const e = E.pos.e; fb = null;
    if (E.pos.j + 1 < M.pa[e].length) E.pos.j++;
    else if (e + 1 < M.pa.length) { E.pos = { e: e + 1, j: 0 }; fiesta(40); guardar(); await pintar(); window.scrollTo(0, 0); toast(`Etapa ${e + 1} terminada: ${ptsE(e)} de ${M.et[e].n}.`, true); return; }
    else { E.t1 = Date.now(); fiesta(130); }
    guardar(); await pintar(); window.scrollTo(0, 0);
  }

  // ---------- reporte
  async function codigo() {
    const sec = (await C.abrir(await C.llave(D.sal, 'sec', M.ord.map(id => E.fr[id] || '').join(';')), D.sec[E.v])).sec;
    const mask = M.ord.reduce((a, id, i) => a + ((E.it[id] && E.it[id].p === 1) ? 2 ** i : 0), 0);
    const cod = (await C.huella(sec, E.nn, E.v, mask)).slice(0, 8).toUpperCase();
    return `V${E.v + 1}-${pts()}-${mask.toString(36).toUpperCase()}-${cod}`;
  }
  async function informe() {
    const P = pts(), tot = T(), min = Math.max(1, Math.round((E.t1 - E.t0) / 60000)), intentos = suma(M.ord.map(id => (E.it[id] && E.it[id].n) || 0));
    let linea = ''; try { linea = await codigo(); } catch { linea = 'No se pudo generar el código'; }
    const fecha = new Date(E.t1).toLocaleString('es-EC', { dateStyle: 'short', timeStyle: 'short' });
    const nota = (P / tot * 10).toFixed(1).replace('.', ',');
    const barras = M.et.map((st, i) => `<div><span><span>${i + 1}. ${esc(st.t)}</span><span>${ptsE(i)} de ${st.n}</span></span><i><b style="width:${ptsE(i) / st.n * 100}%"></b></i></div>`).join('');
    const repasar = M.et.map((st, i) => { const f = st.ids.filter(id => E.it[id] && E.it[id].p === 0).map(id => M.lab[id]); return f.length ? `<li><b>${esc(st.t)}.</b> ${esc(st.rep)} Falló: ${f.map(esc).join('; ')}.</li>` : ''; }).join('');
    const frase = P / tot >= .9 ? 'Turno impecable.' : P / tot >= .7 ? 'Buen turno.' : 'Todavía hay cosas por repasar.';
    app.innerHTML = `<section class="pant rep" id="informe"><p class="ceja">Reporte de práctica · Formas normales</p><h1 id="quien">${esc(E.nom)}</h1>
      <dl class="datos"><dt>Fecha</dt><dd>${esc(fecha)}</dd><dt>Variante</dt><dd>${E.v + 1} de ${D.v.length}</dd><dt>Duración</dt><dd>${min} min</dd><dt>Salidas de la página</dt><dd id="salidas">${E.sal}</dd></dl>
      <div class="total"><span class="num" id="total" data-pts="${P}">${P}</span><p>de ${tot} puntos<br>${nota} sobre 10. ${frase}</p></div>
            <div class="verif">Código de verificación<code id="linea">${esc(linea)}</code></div>
      <h3>Puntos por etapa</h3><div class="barras">${barras}</div>
      <h3>Aciertos y errores</h3><p>Al primer intento: ${P} aciertos y ${tot - P} errores. Intentos en total: ${intentos}. Mejor racha: ${E.rm}.</p>
      <h3>Qué repasar</h3>${repasar ? `<ul>${repasar}</ul>` : '<p>Nada: todo salió bien al primer intento.</p>'}
      <div class="botones no-imp"><button class="btn" id="imprimir">${ic('imprimir')}Guardar como PDF</button><p class="ayuda">Entregue el PDF o una captura de este reporte en Canvas.</p>
      <button class="btn sec" id="otro">Empezar de nuevo</button></div></section>`;
  }

  // ---------- revisión de un reporte: ...#revisar
  function revisar() {
    app.innerHTML = `<section class="pant"><h1 class="banda">Revisión</h1><p class="sub">Compruebe que un reporte no fue alterado.</p>
      <form id="f" autocomplete="off"><label for="cl">Clave de revisión</label><input id="cl" type="password" required style="width:100%;min-height:56px;font-size:20px;padding:10px 14px;border:3px solid var(--azul);border-radius:14px">
      <label for="no" style="margin-top:12px">Nombre, como aparece en el reporte</label><input id="no" type="text" required>
      <label for="li" style="margin-top:12px">Código de verificación</label><input id="li" type="text" placeholder="V3-27-1Z6HK3-9F8E7D6C" required>
      <button class="btn" id="ver" style="margin-top:14px">Revisar</button></form><div id="res"></div></section>`;
  }
  async function verificar() {
    const res = $('#res'), nn = norma($('#no').value), m = $('#li').value.trim().toUpperCase().match(/^V(\d+)-(\d+)-([0-9A-Z]+)-([0-9A-F]{8})$/);
    const dice = (c, t) => { res.className = 'res ' + c; res.textContent = t; };
    if (!m) return dice('mal', 'El código no tiene el formato del reporte.');
    const v = +m[1] - 1, p = +m[2], mask = parseInt(m[3], 36);
    if (!(v >= 0 && v < D.v.length)) return dice('mal', 'La variante del código no existe.');
    let sec; try { sec = (await C.abrir(await C.llaveClave($('#cl').value.trim(), D.sal), D.rev)).sec; } catch { return dice('mal', 'Clave de revisión incorrecta.'); }
    const W = await C.abrir(await C.llave(D.sal, 'caso', v), D.v[v]);
    const bits = W.ord.map((_, i) => Math.floor(mask / 2 ** i) % 2), real = suma(bits);
    const cod = (await C.huella(sec, nn, v, mask)).slice(0, 8).toUpperCase();
    if (cod !== m[4] || real !== p || mask >= 2 ** W.ord.length) return dice('mal', 'No coincide: el reporte fue alterado, o el nombre o el código están mal copiados.');
    const porEtapa = W.et.map((st, i) => `${st.t}: ${suma(st.ids.map(id => bits[W.ord.indexOf(id)]))} de ${st.n}`);
    const fallos = W.ord.filter((_, i) => !bits[i]).map(id => W.lab[id]);
    res.className = 'res bien';
    res.innerHTML = `${ic('check')} Auténtico. Variante ${v + 1}, ${p} de ${W.ord.length} puntos.<br>${porEtapa.map(esc).join('<br>')}<br>${fallos.length ? 'Falló al primer intento: ' + fallos.map(esc).join('; ') + '.' : 'Sin errores en el primer intento.'}`;
  }

  // ---------- salidas de la página: se cuentan y aparecen en el reporte (no bloquean ni reinician)
  function salida() {
    if (!E || E.t1 || descargando) return;
    const a = Date.now(); if (a - ultimaSalida < 1500) return;
    ultimaSalida = a; E.sal++; avisar = true; guardar();
  }
  function regreso() { if (avisar && E && !E.t1) { avisar = false; toast(`Salió de esta página. Queda anotado en el reporte (${E.sal}).`); } }
  document.addEventListener('visibilitychange', () => { if (document.hidden) salida(); else regreso(); });
  window.addEventListener('blur', () => setTimeout(() => { if (!document.hasFocus()) salida(); }, 250));
  window.addEventListener('focus', regreso);
  window.addEventListener('beforeunload', () => { descargando = true; });
  window.addEventListener('pagehide', () => { descargando = true; });

  // ---------- eventos
  app.addEventListener('click', async ev => {
    const t = ev.target, b = t.closest && t.closest('button');
    if (!b || busy) return;
    if (b.id === 'verhoja') return hojaCapa();
    if (b.id === 'pa') return demoPaso(Math.max(1, dp.p - 1));
    if (b.id === 'ps') return demoPaso(dp.p < dp.n ? dp.p + 1 : 1);
    if (b.id === 'ir') { busy = true; try { E.pos = E.pos.e < 0 ? { e: 0, j: 0 } : { e: E.pos.e, j: E.pos.j + 1 }; guardar(); await pintar(); window.scrollTo(0, 0); } finally { busy = false; } return; }
    if (b.id === 'sig') { busy = true; try { await siguiente(); } finally { busy = false; } return; }
    if (b.id === 'imprimir') return window.print();
    if (b.id === 'otro') { if (confirm('Se borrará este reporte de este dispositivo. ¿Ya lo guardó o lo imprimió?')) { try { localStorage.removeItem(KEY); } catch { /* nada */ } E = null; M = null; fb = null; pintar(); } return; }
    if (b.id === 'empezar') return;
    if (b.dataset.op) { busy = true; try { await responder(b.dataset.op); } finally { busy = false; } }
  });
  document.addEventListener('click', ev => { if (ev.target.closest && ev.target.closest('#cerrarhoja')) cerrarHoja(); });
  document.addEventListener('keydown', ev => { if (ev.key === 'Escape') cerrarHoja(); });
  app.addEventListener('submit', async ev => {
    ev.preventDefault(); if (busy) return; busy = true;
    try { if (ev.target.querySelector('#nom')) await empezar(); else if (ev.target.querySelector('#li')) await verificar(); } finally { busy = false; }
  });
  window.addEventListener('hashchange', () => { if (!busy) pintar(); });

  async function pintar() {
    const t = $('#toast'); if (t) t.classList.remove('ver');
    if (dp) { clearTimeout(dp.t); dp = null; }
    cerrarHoja();
    if (location.hash === '#revisar') return revisar();
    if (!E) return inicio();
    if (!M) await cargar();
    if (E.t1) return informe();
    if (E.pos.e < 0) return caso();
    return scr().k === 'd' ? pantallaD() : pantallaQ();
  }
  (async () => {
    try {
      try { E = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch { E = null; }
      if (E && (!E.it || typeof E.v !== 'number')) E = null;
      await pintar();
      if (E && !E.t1 && E.pos.e >= 0) toast('Retomamos donde quedó.');
    } catch (e) { console.error(e); app.innerHTML = '<p class="cargando">No se pudo abrir el juego. Recargue la página.</p>'; }
  })();
})();

</script>
